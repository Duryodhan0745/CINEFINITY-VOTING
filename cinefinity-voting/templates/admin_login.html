{% extends "base.html" %}
{% block title %}Admin login · CINEFINITY{% endblock %}
{% block content %}
<section class="panel" style="max-width:420px;margin:30px auto">
  <h1 class="logo" style="font-size:2.6rem">Admin</h1>
  <form method="post" action="{{ url_for('admin_login') }}">
    <label style="display:grid;gap:6px;font-weight:700">Admin password
      <input type="password" name="password" required autofocus autocomplete="current-password"></label>
    <p><button class="btn btn-big" type="submit">LOG IN</button></p>
  </form>
</section>
{% endblock %}
